<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário de HTML e CSS</title>
    <link rel="stylesheet" href="estilos/questionario.css">
</head>
<body>
    <header>
        <h1>Questionário de HTML e CSS</h1>
    </header>
    <main>
        <form>
            <!-- Pergunta 1 -->
            <label for="q1">O que significa a sigla CSS?</label><br>
            <input type="text" name="q1" id="q1" required><br><br>

            <!-- Pergunta 2 -->
            <label for="q2">Como os atributos 'id' e 'class' são utilizados em CSS?</label><br>
            <textarea name="q2" id="q2" required></textarea><br><br>

            <!-- Pergunta 3 -->
            <label for="q3">Qual das opções abaixo é um comentário válido em CSS?</label><br>
            <select name="q3" id="q3" required>
                <option value="" disabled selected>Escolha uma...</option>
                <option value="option1">Opção 01</option>
                <option value="option2">Opção 02</option>
                <option value="option3">Opção 03</option>
            </select>

            <label for="q4">Qual é a margem inferior dada por essa declaração?>
            <input type="number" name="q4" id="q4" required><br><br>

            <button type="submit">Enviar Questionário</button>
        </form>
    </main>
</body>
</html>
